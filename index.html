<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<title>Animal Gesture Game 🐾</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #fdf8f0;
  --cream-dark: #f5eddc;
  --text: #3d2c1e;
  --text-soft: #7a6352;
  --shadow: rgba(61,44,30,0.12);
  --koala-accent: #9b8fcc;
  --lion-accent: #e8953a;
  --bunny-accent: #e07aad;
  --elephant-accent: #6baed6;
}

html, body {
  height: 100%;
  overscroll-behavior: none;
  background: var(--cream);
}

body {
  font-family: "Nunito", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  padding: clamp(6px, 2vw, 12px) clamp(6px, 2vw, 12px) clamp(8px, 2vw, 16px);
  gap: clamp(5px, 1.5vw, 10px);
  position: relative;
  overflow-x: hidden;
  color: var(--text);
}

/* ── Sky background ──────────────────────────────────────────── */
.sky {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #dff0fc 0%, #fef9f0 55%, #fdf4e3 100%);
  z-index: 0;
  pointer-events: none;
}

/* ── Floating clouds ─────────────────────────────────────────── */
.cloud {
  position: fixed;
  border-radius: 50px;
  background: rgba(255,255,255,0.72);
  filter: blur(2px);
  pointer-events: none;
  z-index: 0;
  animation: floatCloud var(--dur, 28s) linear infinite;
  opacity: 0.7;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud::before { width: 55%; height: 130%; top: -40%; left: 20%; }
.cloud::after  { width: 40%; height: 110%; top: -30%; left: 50%; }

@keyframes floatCloud {
  from { transform: translateX(-200px); }
  to   { transform: translateX(110vw); }
}

/* ── Header ──────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 1;
  position: relative;
  flex-shrink: 0;
}

.header-title {
  font-family: "Baloo 2", cursive;
  font-size: clamp(1.3rem, 4.5vw, 1.9rem);
  font-weight: 800;
  color: var(--text);
  line-height: 1;
  letter-spacing: -0.3px;
}

.header-paws {
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  animation: pawBounce 2.2s ease-in-out infinite;
}
@keyframes pawBounce {
  0%,100% { transform: translateY(0) rotate(-8deg); }
  50%      { transform: translateY(-4px) rotate(8deg); }
}

/* ── Animal selector ─────────────────────────────────────────── */
#animal-dots {
  display: flex;
  gap: 8px;
  align-items: center;
  z-index: 1;
  flex-shrink: 0;
}

.dot {
  display: flex;
  align-items: center;
  justify-content: center;
  width: clamp(44px, 11vw, 54px);
  height: clamp(44px, 11vw, 54px);
  border-radius: 50%;
  background: white;
  border: 2px solid var(--cream-dark);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  font-weight: 700;
  color: var(--text-soft);
  box-shadow: 0 2px 8px var(--shadow);
  touch-action: manipulation;
  user-select: none;
}
.dot-emoji { font-size: clamp(20px, 5vw, 26px); line-height: 1; display: flex; align-items: center; justify-content: center; }
.dot-name  { display: none; }

.dot.active {
  border-color: var(--dot-color, #9b8fcc);
  background: var(--dot-bg, #f3f0ff);
  color: var(--dot-color, #9b8fcc);
  box-shadow: 0 3px 14px var(--dot-shadow, rgba(155,143,204,0.3));
  transform: scale(1.08);
}
.dot:hover:not(.active) { transform: scale(1.04); border-color: #d0c8b8; }

/* ── Main stage ──────────────────────────────────────────────── */
#stage {
  position: relative;
  width: min(540px, 100%);
  /* On small phones, cap height so challenge card stays visible */
  max-height: calc(100dvh - clamp(160px, 30vh, 220px));
  aspect-ratio: 4 / 3;
  background: #1a1a2e;
  border-radius: clamp(14px, 3vw, 24px);
  overflow: hidden;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.22),
    0 0 0 4px white,
    0 0 0 6px var(--stage-border, rgba(155,143,204,0.4));
  z-index: 1;
  flex-shrink: 1;
  transition: box-shadow 0.4s;
}

#vid {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}
#cv {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  transform: scaleX(-1);
}

/* ── Hint pill ───────────────────────────────────────────────── */
#hint {
  position: absolute;
  top: 12px; left: 50%; transform: translateX(-50%);
  white-space: nowrap;
  font-size: clamp(.72rem, 2vw, .88rem);
  font-weight: 700;
  color: white;
  background: rgba(0,0,0,0.42);
  padding: 6px 14px;
  border-radius: 50px;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 4;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.18);
}

/* ── Status bar ──────────────────────────────────────────────── */
#status {
  position: absolute;
  bottom: 10px; left: 50%; transform: translateX(-50%);
  white-space: nowrap;
  font-size: clamp(.68rem, 1.8vw, .8rem);
  font-weight: 700;
  color: rgba(255,255,255,0.82);
  background: rgba(0,0,0,0.32);
  padding: 5px 14px;
  border-radius: 50px;
  pointer-events: none;
  z-index: 4;
  transition: opacity 0.3s;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.12);
}

/* ── Progress arc top bar ────────────────────────────────────── */
#hug-bar-wrap {
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: rgba(255,255,255,0.1);
  pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 5;
}
#hug-bar-wrap.show { opacity: 1; }
#hug-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--bar-a, #c4b5fd), var(--bar-b, #f472b6));
  transition: width 0.08s linear;
  border-radius: 2px;
}

/* ── Hold ring ───────────────────────────────────────────────── */
#ring-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 3;
}
#ring-svg {
  width: 100px; height: 100px;
  opacity: 0; transition: opacity 0.2s;
  filter: drop-shadow(0 0 12px rgba(255,220,100,0.5));
}
#ring-svg.show { opacity: 1; }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 7; }
.ring-fg {
  fill: none; stroke: url(#rg); stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 283; stroke-dashoffset: 283;
  transition: stroke-dashoffset 0.08s linear;
  transform: rotate(-90deg); transform-origin: 50px 50px;
}

/* ── REVEAL OVERLAY ──────────────────────────────────────────── */
#reveal {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: var(--reveal-bg, #1a0a2e);
  opacity: 0;
  transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}
#reveal.show {
  opacity: 1;
  pointer-events: auto;
}

/* Animal video — top portion of reveal */
#animal-video-wrap {
  position: relative;
  width: 100%;
  flex: 0 0 58%;
  overflow: hidden;
  background: #000;
}
#animal-vid {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Video shimmer overlay at bottom */
#animal-video-wrap::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(to bottom, transparent, var(--reveal-bg-solid, #1a0a2e));
  pointer-events: none;
}

/* Info section — bottom portion */
.reveal-info {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 16px 10px;
  gap: 4px;
  position: relative;
}

/* Spelling row with per-letter animation */
#kspell {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}
.spell-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: clamp(22px,5.5vw,34px);
  height: clamp(22px,5.5vw,34px);
  border-radius: 8px;
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.22);
  font-family: "Baloo 2", cursive;
  font-size: clamp(.75rem,2.2vw,1.05rem);
  font-weight: 700;
  color: white;
  opacity: 0;
  transform: translateY(10px) scale(0.8);
  transition: opacity 0.25s, transform 0.25s;
}
.spell-letter.lit {
  opacity: 1;
  transform: translateY(0) scale(1);
  background: var(--letter-bg, rgba(155,143,204,0.3));
  border-color: var(--letter-border, rgba(155,143,204,0.6));
  box-shadow: 0 0 12px var(--letter-glow, rgba(155,143,204,0.4));
}

#kname {
  font-family: "Baloo 2", cursive;
  font-size: clamp(1.6rem, 5.5vw, 2.8rem);
  font-weight: 800;
  color: white;
  line-height: 1;
  text-shadow: 0 2px 20px var(--name-glow, rgba(155,143,204,0.8));
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s 0.1s, transform 0.35s 0.1s;
}
#kname.show { opacity: 1; transform: translateY(0); }

#kfact {
  font-size: clamp(.68rem, 1.9vw, .84rem);
  color: rgba(255,255,255,0.88);
  max-width: 94%;
  text-align: center;
  line-height: 1.5;
  background: rgba(255,255,255,0.1);
  padding: 6px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.18);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s 0.2s, transform 0.35s 0.2s;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
#kfact.show { opacity: 1; transform: translateY(0); }

/* Speech wave */
#speech-wave {
  display: flex; align-items: center; gap: 3px;
  opacity: 0; transition: opacity 0.3s;
  flex-shrink: 0;
}
#speech-wave.active { opacity: 1; }
.wb {
  width: 3px; border-radius: 3px;
  background: rgba(255,255,255,0.6);
  animation: wv 1s ease-in-out infinite;
}
.wb:nth-child(1){ animation-delay:0s }
.wb:nth-child(2){ animation-delay:.1s }
.wb:nth-child(3){ animation-delay:.2s }
.wb:nth-child(4){ animation-delay:.3s }
.wb:nth-child(5){ animation-delay:.2s }
.wb:nth-child(6){ animation-delay:.1s }
.wb:nth-child(7){ animation-delay:0s }
@keyframes wv {
  0%,100%{ height:4px; opacity:.35 }
  50%    { height:16px; opacity:1 }
}

/* ── Sparkles ────────────────────────────────────────────────── */
.spark {
  position: absolute; border-radius: 50%;
  pointer-events: none; z-index: 8;
  animation: burst var(--dur,.8s) ease-out forwards;
}
.spark.star-shape {
  clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  border-radius: 0;
}
@keyframes burst {
  0%  { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
  100%{ transform: translate(var(--tx),var(--ty)) scale(0) rotate(360deg); opacity: 0; }
}

/* ── Challenge card ──────────────────────────────────────────── */
#challenge {
  width: min(540px, 100%);
  background: white;
  border: 2px solid var(--challenge-border, #ede8ff);
  border-radius: clamp(12px, 2.5vw, 18px);
  padding: clamp(8px, 2vw, 12px) clamp(12px, 3vw, 20px);
  text-align: center;
  z-index: 1;
  flex-shrink: 0;
  box-shadow: 0 4px 20px var(--shadow);
  transition: border-color 0.4s, box-shadow 0.4s;
}
#challenge-label {
  font-family: "Baloo 2", cursive;
  font-size: clamp(.9rem, 3.2vw, 1.2rem);
  font-weight: 800;
  color: var(--challenge-color, #9b8fcc);
  margin-bottom: 1px;
  transition: color 0.4s;
}
#challenge-desc {
  color: var(--text-soft);
  font-size: clamp(.72rem, 2.2vw, .88rem);
  font-weight: 600;
  line-height: 1.35;
}

/* ── Start button ────────────────────────────────────────────── */
#startbtn {
  padding: 12px 42px;
  font-size: clamp(.95rem, 2.8vw, 1.05rem);
  background: var(--text);
  color: var(--cream);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 800;
  font-family: "Nunito", sans-serif;
  box-shadow: 0 6px 24px rgba(61,44,30,0.22), 0 0 0 3px var(--cream), 0 0 0 5px rgba(61,44,30,0.1);
  transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
  z-index: 1;
  flex-shrink: 0;
  touch-action: manipulation;
  letter-spacing: 0.2px;
}
#startbtn:hover { transform: translateY(-2px) scale(1.03); }
#startbtn:active { transform: scale(0.97); }
#startbtn:disabled { background: #b0a898; box-shadow: none; transform: none; cursor: default; }

#errmsg {
  color: #c0392b;
  font-size: .86rem;
  text-align: center;
  display: none;
  z-index: 1;
  font-weight: 700;
  background: #fff0ee;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1.5px solid #f5c6c2;
}

/* ── Confetti canvas (unused — removed) ──────────────────────── */
#confetti-canvas { display: none; }

/* ── Voice picker ────────────────────────────────────────────── */
#voice-btn {
  position: fixed;
  bottom: 16px; right: 16px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: white;
  border: 2px solid var(--cream-dark);
  box-shadow: 0 4px 16px var(--shadow);
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  transition: transform .15s, box-shadow .15s;
  touch-action: manipulation;
}
#voice-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px var(--shadow); }

#voice-panel {
  position: fixed;
  bottom: 70px; right: 12px;
  width: min(320px, calc(100vw - 24px));
  background: white;
  border-radius: 18px;
  box-shadow: 0 8px 40px rgba(61,44,30,0.18), 0 0 0 1px rgba(61,44,30,0.06);
  z-index: 101;
  overflow: hidden;
  transform-origin: bottom right;
  transform: scale(0.85);
  opacity: 0;
  pointer-events: none;
  transition: transform .2s cubic-bezier(0.34,1.56,0.64,1), opacity .18s;
}
#voice-panel.open {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}

#voice-panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--cream-dark);
}
#voice-panel-title {
  font-family: "Baloo 2", cursive;
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 2px;
}
#voice-panel-sub {
  font-size: .72rem;
  color: var(--text-soft);
  line-height: 1.4;
}

#voice-search {
  width: 100%;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--cream-dark);
  font-family: "Nunito", sans-serif;
  font-size: .8rem;
  color: var(--text);
  outline: none;
  background: var(--cream);
}
#voice-search:focus { border-color: #c4b5fd; }

#voice-list {
  max-height: 260px;
  overflow-y: auto;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
#voice-list::-webkit-scrollbar { width: 4px; }
#voice-list::-webkit-scrollbar-thumb { background: var(--cream-dark); border-radius: 4px; }

.voice-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .12s;
  border: 1.5px solid transparent;
  touch-action: manipulation;
}
.voice-row:hover { background: var(--cream); }
.voice-row.selected {
  background: #f3f0ff;
  border-color: #c4b5fd;
}
.voice-name {
  flex: 1;
  font-size: .78rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.voice-lang {
  font-size: .68rem;
  color: var(--text-soft);
  font-weight: 600;
  flex-shrink: 0;
  background: var(--cream-dark);
  padding: 1px 5px;
  border-radius: 4px;
}
.voice-preview {
  flex-shrink: 0;
  background: none;
  border: none;
  font-size: 15px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 6px;
  transition: background .12s;
  line-height: 1;
}
.voice-preview:hover { background: var(--cream-dark); }

#voice-panel-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--cream-dark);
  font-size: .68rem;
  color: var(--text-soft);
  text-align: center;
  line-height: 1.4;
}

/* ── Celebration ring pulse on stage ─────────────────────────── */
@keyframes borderPulse {
  0%,100% { box-shadow: 0 20px 60px rgba(0,0,0,0.22), 0 0 0 4px white, 0 0 0 6px var(--stage-border); }
  50%      { box-shadow: 0 20px 60px rgba(0,0,0,0.22), 0 0 0 4px white, 0 0 0 10px var(--stage-border); }
}
#stage.celebrating { animation: borderPulse 0.9s ease-in-out infinite; }
</style>
</head>
<body>

<div class="sky"></div>

<!-- clouds -->
<div class="cloud" style="width:180px;height:50px;top:4vh;--dur:38s;animation-delay:-12s"></div>
<div class="cloud" style="width:120px;height:36px;top:10vh;--dur:28s;animation-delay:-5s"></div>
<div class="cloud" style="width:220px;height:62px;top:2vh;--dur:46s;animation-delay:-22s"></div>
<div class="cloud" style="width:90px;height:28px;top:15vh;--dur:32s;animation-delay:-9s"></div>

<div class="header">
  <div class="header-paws">🐾</div>
  <div class="header-title">Animal Gesture Game</div>
  <div class="header-paws" style="animation-delay:-1.1s">🐾</div>
</div>

<div id="animal-dots"></div>

<div id="stage">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="cv"></canvas>

  <div id="hint">Loading…</div>

  <div id="reveal">
    <div id="animal-video-wrap">
      <video id="animal-vid" playsinline muted loop></video>
    </div>
    <div class="reveal-info">
      <div id="kname"></div>
      <div id="kspell"></div>
      <div id="kfact"></div>
      <div id="speech-wave">
        <div class="wb"></div><div class="wb"></div><div class="wb"></div>
        <div class="wb"></div><div class="wb"></div><div class="wb"></div>
        <div class="wb"></div>
      </div>
    </div>
  </div>

  <div id="ring-wrap">
    <svg id="ring-svg" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" id="rg-a" style="stop-color:#c4b5fd"/>
          <stop offset="100%" id="rg-b" style="stop-color:#f472b6"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fg" id="ring-fg" cx="50" cy="50" r="45"/>
    </svg>
  </div>

  <div id="hug-bar-wrap"><div id="hug-bar"></div></div>
  <div id="status">Tap Start to begin!</div>
</div>

<button id="startbtn">▶ Start Camera</button>
<div id="errmsg"></div>

<!-- Voice picker FAB -->
<button id="voice-btn" title="Change voice" aria-label="Change voice">🔊</button>

<div id="voice-panel" role="dialog" aria-label="Voice selection">
  <div id="voice-panel-header">
    <div id="voice-panel-title">🎙️ Choose a voice</div>
    <div id="voice-panel-sub">Pick whichever voice sounds best on your device. Tap 🔈 to preview.</div>
    <input id="voice-search" type="search" placeholder="Search voices…" autocomplete="off" spellcheck="false"/>
  </div>
  <div id="voice-list"></div>
  <div id="voice-panel-footer">Voices are provided by your device's operating system and vary by platform.</div>
</div>

<div id="challenge">
  <div id="challenge-label"></div>
  <div id="challenge-desc"></div>
</div>

<script>
// ── Animal data ───────────────────────────────────────────────────────────────
const ANIMALS = [
  {
    id: 'koala', emoji: '🐨',
    name: 'KOALA', spell: 'KOALA',
    hint: '🤗 Cross both arms over your chest for a koala hug!',
    gesture: 'HUG',
    videoSrc: 'Koala.mp4',
    revealBg: '#1e1340',
    revealBgSolid: '#1e1340',
    accentColor: '#a78bfa',
    nameGlow: 'rgba(167,139,250,0.9)',

// ── Speech & Voice Picker ─────────────────────────────────────────────────────
// Mobile speech is full of platform bugs. Key rules:
//
// 1. iOS Safari: speechSynthesis.speak() MUST be called synchronously inside a
//    user-gesture handler (tap/click). Any async gap (setTimeout, await, promise
//    chain) breaks the activation context and audio is silently dropped.
//    Fix: we "warm up" the engine on the very first user tap (Start button),
//    and queue utterances immediately without setTimeout delays.
//
// 2. Android Chrome: speechSynthesis silently pauses mid-utterance after ~15s.
//    Fix: periodic resume() calls while speaking.
//
// 3. iOS voiceschanged never fires if voices are already cached.
//    Fix: poll + event listener combo, with a hard timeout fallback.
//
// 4. Assigning a SpeechSynthesisVoice object that has been GC'd or
//    invalidated (happens across page navigation on iOS) causes silence.
//    Fix: always re-fetch voice by NAME from the live getVoices() list.
//
// 5. Empty utterance or utterance spoken before voices list loads = silence.
//    Fix: voicesReady() gate + fallback to no-voice (browser default).

let _allVoices = [];
let _selectedVoiceName = null; // store NAME string, not the object (avoids GC issues)
let _voicesReady = false;
let _voicesReadyCallbacks = [];
let _speechWarmedUp = false;   // iOS: tracks whether we've done a silent warm-up speak

function _onVoicesReady() {
  if (_voicesReady) return;
  _voicesReady = true;
  _allVoices = speechSynthesis.getVoices();
  buildVoicePicker();
  _voicesReadyCallbacks.forEach(fn => fn());
  _voicesReadyCallbacks = [];
}

function _tryLoadVoices() {
  const v = speechSynthesis.getVoices();
  if (v.length > 0) { _allVoices = v; _onVoicesReady(); return true; }
  return false;
}

function voicesReady() {
  return new Promise(resolve => {
    if (_voicesReady) { resolve(); return; }
    _voicesReadyCallbacks.push(resolve);
  });
}

if (!_tryLoadVoices()) {
  const poll = setInterval(() => { if (_tryLoadVoices()) clearInterval(poll); }, 80);
  setTimeout(() => { clearInterval(poll); _onVoicesReady(); }, 4000);
}
speechSynthesis.addEventListener('voiceschanged', _tryLoadVoices);

// iOS warm-up: speak a silent utterance synchronously during the Start button
// tap so the AudioSession is activated. Without this, the first real speak()
// call (which happens inside a promise chain) has no activation and is dropped.
function warmUpSpeech() {
  if (_speechWarmedUp) return;
  _speechWarmedUp = true;
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    speechSynthesis.speak(u);
    // Cancel immediately — we just needed to activate the session
    setTimeout(() => speechSynthesis.cancel(), 50);
  } catch(e) { /* ignore */ }
}

// Auto-pick: prefer female British, fall back gracefully
const _MALE = /\b(daniel|george|ryan|oliver|arthur|william|richard|henry|edward|james|mark|thomas|peter|jack|adam|charlie|patrick|christopher|stephen|gordon|fred|bruce|male)\b/i;

function _autoPick() {
  const v = _allVoices.length ? _allVoices : speechSynthesis.getVoices();
  const prefs = [
    x => x.name === 'Google UK English Female',
    x => x.lang === 'en-GB' && /serena/i.test(x.name),
    x => x.lang === 'en-GB' && /\b(libby|mia|sonia|hazel|kate|emily|martha|amy|fiona|moira|tessa|victoria|claire|alice|grace|helen|natasha)\b/i.test(x.name),
    x => x.lang === 'en-GB' && /female|woman/i.test(x.name),
    x => x.lang === 'en-GB' && !_MALE.test(x.name),
    x => x.lang === 'en-AU' && /karen|catherine|female|woman/i.test(x.name),
    x => x.lang === 'en-AU' && !_MALE.test(x.name),
    x => /\b(samantha|victoria|allison|ava|zoe|susan)\b/i.test(x.name),
    x => /female|woman/i.test(x.name),
    x => x.lang.startsWith('en'),
  ];
  for (const fn of prefs) { const m = v.find(fn); if (m) return m; }
  return null;
}

// Always resolve voice from live list by name to avoid GC'd object issues on iOS
function pickVoice() {
  const live = speechSynthesis.getVoices();
  if (_selectedVoiceName) {
    const found = live.find(v => v.name === _selectedVoiceName);
    if (found) return found;
  }
  // Re-run autopick against live list each time
  const autoName = _autoPick();
  if (autoName) {
    const found = live.find(v => v.name === autoName.name);
    if (found) return found;
  }
  return null;
}

// Android Chrome: silent-pause bug fix
let _resumeTimer = null;
function _startResumeHack() {
  if (_resumeTimer) return;
  _resumeTimer = setInterval(() => {
    try { if (speechSynthesis.speaking) speechSynthesis.resume(); } catch(e){}
  }, 5000); // tighter interval catches the pause sooner
}
function _stopResumeHack() { clearInterval(_resumeTimer); _resumeTimer = null; }

function utter(text, rate = 0.88, pitch = 1.06) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.pitch = pitch; u.volume = 1;
  const v = pickVoice();
  if (v) u.voice = v;
  // Always pin lang — prevents browser swapping to a different locale's voice
  u.lang = (v && v.lang) ? v.lang : 'en-GB';
  return u;
}

// ── Voice picker UI ───────────────────────────────────────────────────────────
function buildVoicePicker() {
  // Only show English voices — sorted: en-GB first, then en-AU, then en-US, rest
  const engVoices = _allVoices
    .filter(v => v.lang.startsWith('en'))
    .sort((a, b) => {
      const rank = l => l === 'en-GB' ? 0 : l === 'en-AU' ? 1 : l === 'en-US' ? 2 : 3;
      return rank(a.lang) - rank(b.lang) || a.name.localeCompare(b.name);
    });

  if (engVoices.length === 0) {
    document.getElementById('voice-btn').style.display = 'none';
    return;
  }

  const autoVoice = _autoPick();
  renderVoiceList(engVoices, autoVoice, '');

  // Search filter
  document.getElementById('voice-search').addEventListener('input', e => {
    renderVoiceList(engVoices, autoVoice, e.target.value.trim().toLowerCase());
  });

  // Toggle panel
  document.getElementById('voice-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('voice-panel').classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!document.getElementById('voice-panel').contains(e.target) &&
        e.target !== document.getElementById('voice-btn')) {
      document.getElementById('voice-panel').classList.remove('open');
    }
  });
}

function renderVoiceList(voices, autoVoice, filter) {
  const list = document.getElementById('voice-list');
  list.innerHTML = '';

  const filtered = filter ? voices.filter(v =>
    v.name.toLowerCase().includes(filter) || v.lang.toLowerCase().includes(filter)
  ) : voices;

  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding:12px;text-align:center;font-size:.78rem;color:var(--text-soft)">No voices match</div>';
    return;
  }

  filtered.forEach(voice => {
    const isSelected = _selectedVoiceName
      ? _selectedVoiceName === voice.name
      : autoVoice && autoVoice.name === voice.name;

    const row = document.createElement('div');
    row.className = 'voice-row' + (isSelected ? ' selected' : '');
    row.title = voice.name;

    // Flag emoji from lang
    const flag = langFlag(voice.lang);
    const autoTag = (!_selectedVoiceName && autoVoice && autoVoice.name === voice.name)
      ? ' <span style="font-size:.62rem;background:#e9d5ff;color:#7c3aed;padding:1px 5px;border-radius:4px;margin-left:3px">auto</span>' : '';

    row.innerHTML = `
      <span style="font-size:15px;flex-shrink:0">${flag}</span>
      <span class="voice-name">${voice.name}${autoTag}</span>
      <span class="voice-lang">${voice.lang}</span>
      <button class="voice-preview" title="Preview this voice" aria-label="Preview">🔈</button>
    `;

    // Select voice on row click
    row.addEventListener('click', e => {
      if (e.target.classList.contains('voice-preview')) return;
      _selectedVoiceName = voice.name; // store NAME, not the object
      document.querySelectorAll('.voice-row').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      // Flash the button to confirm
      const btn = document.getElementById('voice-btn');
      btn.textContent = '✅';
      setTimeout(() => { btn.textContent = '🔊'; }, 900);
      document.getElementById('voice-panel').classList.remove('open');
    });

    // Preview button — re-fetch voice from live list to avoid GC'd object
    row.querySelector('.voice-preview').addEventListener('click', e => {
      e.stopPropagation();
      speechSynthesis.cancel();
      const liveVoice = speechSynthesis.getVoices().find(v => v.name === voice.name);
      if (!liveVoice) return;
      const u = new SpeechSynthesisUtterance('Hello! Koala! K… O… A… L… A!');
      u.voice = liveVoice; u.lang = liveVoice.lang; u.rate = 0.82; u.pitch = 1.06; u.volume = 1;
      speechSynthesis.speak(u);
    });

    list.appendChild(row);
  });
}

function langFlag(lang) {
  const map = {
    'en-GB': '🇬🇧', 'en-US': '🇺🇸', 'en-AU': '🇦🇺',
    'en-CA': '🇨🇦', 'en-IN': '🇮🇳', 'en-IE': '🇮🇪',
    'en-NZ': '🇳🇿', 'en-ZA': '🇿🇦', 'en-SG': '🇸🇬',
  };
  return map[lang] || '🌐';
}

async function speakAnimal(animal, fact) {
  // Wait for voices to be available (critical on mobile)
  await voicesReady();

  return new Promise(resolve => {
    speechSynthesis.cancel();

    const spelled = animal.spell.split('').join('... ');
    const seq = [
      utter(animal.name + '!', 0.88, 1.08),
      utter(spelled,           0.65, 1.06),  // slower for kids to follow each letter
      utter(animal.name + '!', 0.88, 1.08),
      utter(fact,              0.82, 1.04)
    ];

    let i = 0;
    _startResumeHack();

    function next() {
      if (i >= seq.length) { _stopResumeHack(); resolve(); return; }
      const u = seq[i++];
      u.onend   = next;
      // onerror: on iOS, utterances sometimes fire error instead of end
      // (e.g. "interrupted" when cancel() was called on a previous one).
      // We treat any error as "done with this utterance" so the chain continues.
      u.onerror = (e) => {
        // "interrupted" just means we cancelled the previous — safe to continue
        if (e.error === 'interrupted' || e.error === 'canceled') { next(); return; }
        // For real errors, still advance so the sequence doesn't hang
        console.warn('TTS error:', e.error);
        next();
      };
      try {
        // IMPORTANT: speak() must NOT be inside a setTimeout on iOS — the
        // gesture activation context must be maintained synchronously.
        // The chain is driven by onend/onerror callbacks, which IS synchronous
        // enough for iOS to accept subsequent speak() calls in the same session.
        speechSynthesis.speak(u);
      } catch(e) {
        // Fallback: if speak() itself throws (very rare), advance the chain
        console.warn('speak() threw:', e);
        next();
      }
    }

    // iOS Safari quirk: if we call speak() immediately after cancel(),
    // the first utterance can get dropped. A minimal RAF delay (not setTimeout!)
    // is enough to let the cancel settle without breaking the gesture context.
    requestAnimationFrame(() => requestAnimationFrame(next));
  });
}

// ── Gesture helpers ───────────────────────────────────────────────────────────
function fingerExtended(h, tip, pip) {
  return h[tip].y < h[pip].y - 0.018;
}
function handOpen(h) {
  return [[8,6],[12,10],[16,14],[20,18]].every(([t,p]) => fingerExtended(h,t,p));
}
function onlyIndex(h) {
  return fingerExtended(h,8,6) &&
    !fingerExtended(h,12,10) &&
    !fingerExtended(h,16,14) &&
    !fingerExtended(h,20,18);
}

// CLAW gesture: fingers spread but curled — tips NOT extended past MCP (knuckle),
// but fingers are spread apart (not in a fist). We check that:
//   - at least 3 of the 4 fingers have tips BELOW their PIP joint (curled inward)
//   - the hand is NOT fully closed (some spread present via MCP spread)
//   - thumb tip is spread out from index MCP
function handClaw(h) {
  // Count curled fingers: tip.y > pip.y means tip is below pip = curled
  const fingers = [[8,7,6],[12,11,10],[16,15,14],[20,19,18]];
  let curledCount = 0;
  for (const [tip, dip, pip] of fingers) {
    // Curled: tip is not extended past pip (tip.y >= pip.y - 0.01, i.e. bent)
    if (h[tip].y >= h[pip].y - 0.01) curledCount++;
  }
  // Need at least 3 fingers curled
  if (curledCount < 3) return false;
  // Hand should not be fully fisted: wrist-to-middle-mcp spread should exist
  // Check that fingers are not all bunched (middle finger MCP x-spread from index MCP)
  const spread = Math.abs(h[10].x - h[6].x);
  // Accept any reasonable spread (not a completely closed fist)
  return spread > 0.02;
}

const HISTORY = 6;
let wristHistory = [];

function pushWrists(hands) {
  if (hands.length < 2) { wristHistory = []; return; }
  const sorted = [...hands].sort((a,b) => a[0].x - b[0].x);
  const L = sorted[0], R = sorted[sorted.length-1];
  wristHistory.push({
    lx: L[0].x, ly: L[0].y,
    rx: R[0].x, ry: R[0].y,
    crossed: R[0].x < L[0].x + 0.06,
    lOpen: handOpen(L), rOpen: handOpen(R),
    lClaw: handClaw(L), rClaw: handClaw(R),
    lIdx: onlyIndex(L), rIdx: onlyIndex(R),
    handCount: hands.length
  });
  if (wristHistory.length > HISTORY) wristHistory.shift();
}

function checkGesture(gesture) {
  if (wristHistory.length < 3) return false;
  const recent = wristHistory.slice(-3);
  return recent.every(f => {
    if (f.handCount < 2) return false;
    const dist  = Math.abs(f.rx - f.lx);
    const avgY  = (f.ly + f.ry) / 2;
    const highY = Math.min(f.ly, f.ry);

    switch (gesture) {
      case 'HUG':
        if (f.handCount >= 3) return true;
        return (dist < 0.38 || f.crossed) && avgY > 0.18 && avgY < 0.96;

      case 'ROAR':
        // Lion CLAW: both hands show a claw shape (fingers curled, spread beside face)
        // Accept: both clawing OR both open (for kids who do open hands)
        // Hands should be raised (avgY < 0.7) and somewhat apart
        if (f.lClaw && f.rClaw && avgY < 0.72) return true;
        // Fallback: open hands high and apart (original roar)
        if (f.lOpen && f.rOpen && dist > 0.30 && avgY < 0.68) return true;
        return false;

      case 'EARS':
        return f.lIdx && f.rIdx && avgY < 0.58;

      case 'TRUNK':
        return f.lOpen && f.rOpen && highY < 0.45 && avgY < 0.50;

      default: return false;
    }
  });
}

// ── State machine ─────────────────────────────────────────────────────────────
let gestureStart = null, showing = false, cooldown = false;
const HOLD_MS = 650;

function onResults(results) {
  const cv  = document.getElementById('cv');
  const vid = document.getElementById('vid');
  const ctx = cv.getContext('2d');
  cv.width  = vid.videoWidth  || 640;
  cv.height = vid.videoHeight || 480;
  ctx.clearRect(0, 0, cv.width, cv.height);

  const hands = results.multiHandLandmarks || [];
  for (const lm of hands) {
    drawConnectors(ctx, lm, HAND_CONNECTIONS, {color:'rgba(255,255,255,0.2)', lineWidth:2});
    drawLandmarks(ctx, lm, {color:'rgba(255,255,255,0.7)', lineWidth:1, radius:3});
  }

  if (showing || cooldown) return;

  pushWrists(hands);
  const animal  = ANIMALS[currentAnimal];
  const isMatch = checkGesture(animal.gesture);

  const ring    = document.getElementById('ring-svg');
  const ringFg  = document.getElementById('ring-fg');
  const hugWrap = document.getElementById('hug-bar-wrap');
  const hugBar  = document.getElementById('hug-bar');
  const CIRC    = 283;

  if (isMatch) {
    if (!gestureStart) gestureStart = Date.now();
    const pct = Math.min(1, (Date.now() - gestureStart) / HOLD_MS);
    ring.classList.add('show');
    hugWrap.classList.add('show');
    ringFg.style.strokeDashoffset = CIRC * (1 - pct);
    hugBar.style.width = (pct * 100) + '%';
    document.getElementById('status').textContent = '✨ Great! Hold it a moment…';
    if (pct >= 1) triggerAnimal();
  } else {
    gestureStart = null;
    ring.classList.remove('show');
    hugWrap.classList.remove('show');
    ringFg.style.strokeDashoffset = CIRC;
    hugBar.style.width = '0%';
    const h = hands.length;
    document.getElementById('status').textContent =
      h >= 2 ? 'Both hands seen! Try the gesture!' :
      h === 1 ? 'One hand — show both hands!' :
                'No hands seen — come closer!';
  }
}

async function triggerAnimal() {
  if (showing) return;
  showing = true;
  wristHistory = [];
  gestureStart = null;

  const idx    = currentAnimal;
  const animal = ANIMALS[idx];
  const fact   = getNextFact(idx);

  // Build spell letters
  buildSpellLetters(animal);

  // Set name style
  const kname = document.getElementById('kname');
  kname.textContent = animal.name;
  kname.style.textShadow = `0 2px 24px ${animal.nameGlow}`;
  kname.classList.remove('show');

  // Set fact
  const kfact = document.getElementById('kfact');
  kfact.textContent = fact;
  kfact.classList.remove('show');

  // Load and play animal video
  const animalVid = document.getElementById('animal-vid');
  animalVid.src = animal.videoSrc;
  animalVid.load();

  // Reveal overlay
  document.getElementById('reveal').style.background = animal.revealBg;

  // Show reveal
  document.getElementById('reveal').classList.add('show');
  document.getElementById('hint').style.opacity   = '0';
  document.getElementById('status').style.opacity = '0';
  document.getElementById('ring-svg').classList.remove('show');
  document.getElementById('hug-bar-wrap').classList.remove('show');

  // Play animal video
  try { await animalVid.play(); } catch(e) { /* autoplay blocked silently */ }

  // Animate stage border
  document.getElementById('stage').classList.add('celebrating');

  // Sparks
  spawnSparks(animal.accentColor);

  // Animate name in
  setTimeout(() => kname.classList.add('show'), 100);

  // Animate spelling (with slight delay after name)
  setTimeout(() => {
    animateSpelling(animal);
  }, 300);

  // Show fact after spelling completes
  const spellDuration = animal.spell.length * 340 + 600;
  setTimeout(() => kfact.classList.add('show'), spellDuration);

  // Speech wave
  const wave = document.getElementById('speech-wave');
  wave.classList.add('active');

  // Speak + min display time
  await Promise.all([
    speakAnimal(animal, fact),
    new Promise(r => setTimeout(r, Math.max(spellDuration + 1500, 4000)))
  ]);

  await new Promise(r => setTimeout(r, 800));

  // Cleanup
  document.getElementById('stage').classList.remove('celebrating');
  wave.classList.remove('active');
  animalVid.pause();
  animalVid.src = '';

  // Hide reveal
  document.getElementById('reveal').classList.remove('show');
  document.getElementById('hint').style.opacity   = '1';
  document.getElementById('status').style.opacity = '1';

  // Reset letter states
  document.querySelectorAll('.spell-letter').forEach(el => el.classList.remove('lit'));
  kname.classList.remove('show');
  kfact.classList.remove('show');

  showing  = false;
  cooldown = true;

  setTimeout(() => {
    cooldown = false;
    wristHistory = [];
    const next = (currentAnimal + 1) % ANIMALS.length;
    setAnimal(next);
  }, 1200);
}

// ── Build dots ────────────────────────────────────────────────────────────────
(function buildDots() {
  const wrap = document.getElementById('animal-dots');
  ANIMALS.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = a.name;
    d.innerHTML = `<span class="dot-emoji">${a.emoji}</span><span class="dot-name">${a.name}</span>`;
    d.style.setProperty('--dot-color', a.dotColor);
    d.style.setProperty('--dot-bg', a.dotBg);
    d.style.setProperty('--dot-shadow', a.dotShadow);
    d.addEventListener('click', () => { if (!showing && !cooldown) setAnimal(i); });
    wrap.appendChild(d);
  });
  setAnimal(0);
})();

// ── Camera bootstrap ──────────────────────────────────────────────────────────
document.getElementById('startbtn').addEventListener('click', async () => {
  // iOS: must call speak() synchronously in the gesture handler to activate
  // the AudioSession BEFORE any async work happens. warmUpSpeech() does a
  // silent zero-volume utterance to unlock audio for all future speak() calls.
  warmUpSpeech();

  const btn = document.getElementById('startbtn');
  btn.disabled = true; btn.textContent = 'Starting…';

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: {ideal:640}, height: {ideal:480} }
    });
  } catch(e) {
    const err = document.getElementById('errmsg');
    err.style.display = 'block';
    err.textContent = '⚠ Camera access denied — please allow camera and reload.';
    btn.disabled = false; btn.textContent = '▶ Start Camera';
    return;
  }

  const vid = document.getElementById('vid');
  vid.srcObject = stream;
  await new Promise(r => vid.onloadedmetadata = r);
  await vid.play();
  btn.style.display = 'none';

  document.getElementById('status').textContent = 'Loading hand detector…';

  await Promise.all([
    loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js'),
    loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js'),
  ]);

  const handsModel = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  handsModel.setOptions({
    maxNumHands: 4,
    modelComplexity: 1,
    minDetectionConfidence: 0.60,
    minTrackingConfidence: 0.55
  });
  handsModel.onResults(onResults);

  document.getElementById('status').textContent = '👋 Hands ready — try the gesture!';

  async function pump() {
    if (vid.readyState >= 2) await handsModel.send({image: vid});
    requestAnimationFrame(pump);
  }
  pump();
});

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
</script>
